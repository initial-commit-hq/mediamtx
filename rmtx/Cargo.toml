[workspace]
resolver = "2"
members = [
    "crates/rmtx",
    "crates/rmtx-conf",
    "crates/rmtx-api",
    "crates/rmtx-path",
    "crates/rmtx-hooks",
    "crates/rmtx-metrics",
    "crates/rmtx-auth",
    "crates/rmtx-record",
    "crates/rmtx-playback",
    "crates/rmtx-stream",
    "crates/rmtx-servers-rtsp",
    "crates/rmtx-servers-rtmp",
    "crates/rmtx-servers-hls",
    "crates/rmtx-servers-webrtc",
    "crates/rmtx-servers-viewer",
    "crates/rmtx-servers-srt",
    "crates/rmtx-staticsources",
    "crates/rmtx-ffmpeg",
    "crates/rmtx-bench",
    "crates/rmtx-mux",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/initial-commit-hq/mediamtx"
rust-version = "1.75"

[workspace.dependencies]
bytes = "1"
regex = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
axum = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
